name: Knowledge graph
on: [push, pull_request]
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-knowledge-graph.py
      - run: python scripts/update-knowledge-graph.py --check
